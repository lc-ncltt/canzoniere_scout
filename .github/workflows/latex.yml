name: Rigenera sorgente LaTeX

# Quando cambiano dati, script o template, rigenera overleaf/ (canzoniere.tex + QR)
# e lo committa su main, così Overleaf lo trova aggiornato al prossimo "Pull".
# overleaf/ non è nei percorsi osservati: il commit automatico non rilancia il job.
on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "latex/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install segno
      - run: python3 scripts/validate_canti.py
      - run: python3 scripts/make_qr.py
      - run: python3 scripts/generate_latex.py
      - name: Commit se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overleaf
          git diff --cached --quiet || git commit -m "Rigenera overleaf/ da data e template"
          git push
