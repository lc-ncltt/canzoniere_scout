<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Canzoniere</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script>
  /* Applica il tema salvato prima del primo disegno, per evitare il lampo bianco di notte. */
  try { var t = localStorage.getItem('tema'); if (t) document.documentElement.setAttribute('data-tema', t); } catch (e) {}
</script>
</head>
<body>
<header>
  <a href="#/" class="titolo-sito">Canzoniere</a>
  <button id="tema" type="button" aria-pressed="false">Scuro</button>
</header>

<main>
  <section id="home">
    <form id="form" autocomplete="off">
      <label for="codice">Codice del canto</label>
      <div class="riga-form">
        <input id="codice" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="12" autofocus>
        <button type="submit">Apri</button>
      </div>
    </form>
    <p id="anteprima" role="status" aria-live="polite"></p>
    <details>
      <summary>Elenco dei canti</summary>
      <ul id="elenco"></ul>
    </details>
    <noscript><p>Questa pagina richiede JavaScript.</p></noscript>
  </section>

  <article id="canto" hidden>
    <nav>
      <a href="#/">← Codice</a>
      <span class="spazio"></span>
      <a id="prec" href="#/" aria-label="Canto precedente">‹ Prec</a>
      <a id="succ" href="#/" aria-label="Canto successivo">Succ ›</a>
    </nav>

    <h1><span id="c-num"></span> <span id="c-titolo"></span></h1>
    <dl id="info"></dl>

    <div id="audio-box" hidden>
      <audio id="audio" controls preload="none"></audio>
      <p id="audio-err" hidden>Audio non disponibile (sei offline?).</p>
    </div>
    <p id="spartito-box" hidden><a id="spartito" class="bottone" target="_blank" rel="noopener">Spartito (PDF)</a></p>

    <div class="strumenti">
      <button id="b-accordi" type="button" aria-pressed="true">Accordi</button>
      <button id="b-meno" type="button" aria-label="Riduci testo">A−</button>
      <button id="b-piu" type="button" aria-label="Ingrandisci testo">A+</button>
    </div>
    <div id="testo"></div>
  </article>
</main>

<script src="app.js"></script>
</body>
</html>
